name: Docker image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mistgate-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish amd64 / arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compute image name and build metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mistgate-panel" >> "$GITHUB_OUTPUT"
          echo "version=git-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "built=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push multiplatform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            BUILD_UNIX=${{ steps.vars.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Verify published image
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          first_tag="$(printf '%s\n' "$PUBLISHED_TAGS" | head -n 1)"
          test -n "$first_tag"
          docker buildx imagetools inspect "$first_tag"
          docker run --rm --platform linux/amd64 "$first_tag" version

      - name: Publish summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Mistgate Docker image published"
            echo "Image: \`$IMAGE:main\`"
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
